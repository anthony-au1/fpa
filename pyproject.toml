[project]
name = "financial-processing-agent"
version = "0.1.0"
description = "Foundation for a controlled Accounts Payable processing agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "langgraph==0.4.8",
  "pydantic==2.11.5",
  "pydantic-settings==2.9.1",
  "sqlalchemy==2.0.41",
  "uvicorn==0.34.3",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "pytest-cov==6.1.1",
  "ruff==0.11.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
